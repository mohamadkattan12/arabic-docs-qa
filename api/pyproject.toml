[project]
name = "api"
version = "0.1.0"
description = "Arabic/English document Q&A API: hybrid retrieval, Claude citations, evaluation"
readme = "README.md"
authors = [
    { name = "mohamadkattan12", email = "65044962+mohamadkattan12@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "python-multipart>=0.0.32",
    "sse-starlette>=3.5.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.mypy]
strict = true
packages = ["api"]
mypy_path = "src"

[[tool.mypy.overrides]]
# PyMuPDF ships without complete type hints.
module = "api.chunking"
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# PyMuPDF's SWIG bindings warn on import; not our code.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
